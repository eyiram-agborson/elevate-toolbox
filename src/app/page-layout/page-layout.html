<main class="fixed top-0 z-50 w-full border-b border-gray-200 bg-white">
  <div class="relative mx-auto flex h-[65px] items-center px-6 md:px-20">

    <!-- Logo -->
    <div class="flex items-center">
      <img
        src="/etz-logo.png"
        alt="ETZ logo"
        class="h-7 w-auto object-contain"
      />
    </div>

    <!-- Center Navigation -->
    <nav class="absolute left-1/2 flex -translate-x-1/2 items-center gap-1">

      <a
        routerLink="/dashboard"
        routerLinkActive="!bg-[#edf6ff] !text-[#5AA4FF]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-full px-5 py-2 text-sm font-medium !text-gray-500 transition-colors hover:!bg-gray-100 hover:!text-gray-900"
      >
        Dashboard
      </a>

@if (roleService.hasRole('manager')) {
  <a
    routerLink="/elevate"
    routerLinkActive="!bg-[#edf6ff] !text-[#5AA4FF]"
    [routerLinkActiveOptions]="{ exact: true }"
    class="rounded-full px-5 py-2 text-sm font-medium !text-gray-500 transition-colors hover:!bg-gray-100 hover:!text-gray-900"
  >
    Elevate
  </a>
}

  @if (roleService.hasRole('hr')) {
    <a
      routerLink="hr/kpi-templates"
      routerLinkActive="!bg-[#edf6ff] !text-[#4d94d7]"
      class="rounded-full px-5 py-2 text-sm font-medium !text-gray-500 transition-colors hover:!bg-gray-100 hover:!text-gray-900"
    >
      KPI Templates
    </a>
  }

  @if (roleService.hasRole('hr')) {
    <a
      routerLink="hr/performance-cycles"
      routerLinkActive="!bg-[#edf6ff] !text-[#5AA4FF]"
      class="rounded-full px-5 py-2 text-sm font-medium !text-gray-500 transition-colors hover:!bg-gray-100 hover:!text-gray-900"
    >
      Performance Cycles
    </a>
  }

  @if (roleService.hasRole('hr')) {
    <a
      routerLink="hr/departments"
      routerLinkActive="!bg-[#edf6ff] !text-[#4d94d7]"
      class="rounded-full px-5 py-2 text-sm font-medium !text-gray-500 transition-colors hover:!bg-gray-100 hover:!text-gray-900"
    >
      Departments
    </a>
  }


    </nav>

    <!-- User -->
    <div class="ml-auto flex items-center gap-3">

      <div class="flex flex-col text-right">
        <span class="text-[13px] font-semibold text-gray-900">
          Sally Smith
        </span>

        <span class="text-[11px] text-gray-500">
          Customer Support
        </span>
      </div>

      <div
        class="flex h-9 w-9 items-center justify-center rounded-full bg-gray-200 text-sm font-medium text-gray-600"
      >
        S
      </div>

    </div>

  </div>
</main>

<div class="min-h-screen bg-[#f6f7f9] pt-[65px]">
  <router-outlet></router-outlet>
</div>
